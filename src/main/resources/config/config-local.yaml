# Local workstation settings. Broker credentials live in secure-config-local.yaml.
kafka:
  bootstrapServers: "localhost:9092"
  consumer:
    groupId: "fleet-events-kafka"
    consumerAmount: "1"
    parallelConsumers: "1"
    pollTimeoutMs: "1000"
    # A record that keeps failing is redelivered this many times before it is dead-lettered.
    maxRedeliveries: "5"
  topics:
    telemetry: "fleet.telemetry"
    alerts: "fleet.alerts"
    metrics: "fleet.metrics"
    deadLetter: "fleet.telemetry.dlq"

dedup:
  # Duplicates come from producer retries and from redelivery after a rebalance or restart,
  # both of which happen within minutes.
  ttlMinutes: "60"
  expiryIntervalMinutes: "5"

fleet:
  thresholds:
    coolantTempMaxC: "105"
    oilPressureMinKpa: "150"
    tyrePressureMinKpa: "600"
    tyreTempMaxC: "85"
    overloadPct: "110"
    speedMaxKph: "60"
    fuelMinPct: "10"
